[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
description = "Plug-in evaluation for AI apps: test sets, scorers, LLM judge, A/B tests and a CI quality gate."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
evalkit = "evalkit.cli:app"

[tool.setuptools.packages.find]
include = ["evalkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"evalkit/core/report.py" = ["E501"]
"evalkit/cli.py" = ["E501"]
"evalkit/scorers/*.py" = ["E501"]
"evalkit/*/*.py" = ["E501"]
"examples/*/*.py" = ["E501"]
